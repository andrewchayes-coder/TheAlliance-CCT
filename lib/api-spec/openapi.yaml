openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /account/profile:
    get:
      operationId: getAccountProfile
      responses:
        "200":
          description: Own account settings; no private storage keys or credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
    patch:
      operationId: updateAccountProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountDetails" }
      responses:
        "200":
          description: Saved account details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
  /account/email:
    post:
      operationId: requestAccountEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountEmailChange" }
      responses:
        "200":
          description: Verification requested; primary email unchanged until confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
    delete:
      operationId: cancelAccountEmailChange
      responses:
        "200":
          description: Pending change cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
  /account/password:
    post:
      operationId: changeAccountPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountPasswordChange" }
      responses:
        "200":
          description: Password changed; all sessions invalidated.
          content:
            application/json:
              schema: { type: object, required: [ok, nextPath], properties: { ok: { type: boolean }, nextPath: { type: string } } }
  /account/photo:
    post:
      operationId: uploadAccountPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "200":
          description: Private PNG photo saved; JPEG/PNG/WebP input, maximum 3 MB, metadata stripped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
    delete:
      operationId: removeAccountPhoto
      responses:
        "200":
          description: Photo removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
  /account/users/{userId}/photo:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPrivateAccountPhoto
      responses:
        "200":
          description: Authenticated PNG; accessible only by owner or administrator.
          content:
            image/png:
              schema: { type: string, format: binary }
  /admin/users/{userId}/profile:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getManagedAccountProfile
      responses:
        "200":
          description: Administrator-managed account settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
    patch:
      operationId: updateManagedAccountProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountDetails" }
      responses:
        "200":
          description: Saved without changing role or activation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
  /admin/users/{userId}/email:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: requestManagedAccountEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountEmailChange" }
      responses:
        "200":
          description: New email verification requested; self edits still require current password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
    delete:
      operationId: cancelManagedAccountEmailChange
      responses:
        "200":
          description: Pending email change cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
  /admin/users/{userId}/photo:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: uploadManagedAccountPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "200":
          description: Team member photo uploaded privately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
    delete:
      operationId: removeManagedAccountPhoto
      responses:
        "200":
          description: Team member photo removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
  /admin/users/{userId}/password-reset:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: sendManagedPasswordReset
      responses:
        "200":
          description: Reset link sent via central email service; test-account mail suppressed.
          content:
            application/json:
              schema: { type: object, required: [ok, message], properties: { ok: { type: boolean }, message: { type: string }, deliveryFailed: { type: boolean } } }
  /admin/schedule/standard-grid:
    post:
      operationId: loadStandardGrid
      tags: [schedule]
      responses:
        '200': { description: Grid loaded, content: { application/json: { schema: { type: object, required: [created, skipped], properties: { created: { type: integer }, skipped: { type: integer } } } } } }
  /admin/schedule/extras:
    get:
      operationId: getScheduleExtras
      tags: [schedule]
      responses:
        '200': { description: Staff schedule extras, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleExtras' } } } }
  /admin/schedule/blocks:
    post:
      operationId: blockScheduleSlots
      tags: [schedule]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SlotBlockInput' } } } }
      responses:
        '200': { description: Blocks saved, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleExtras' } } } }
  /admin/schedule/blocks/{blockId}:
    delete:
      operationId: unblockScheduleSlot
      tags: [schedule]
      parameters: [{ name: blockId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Block removed, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleExtras' } } } }
  /admin/schedule/custom-shifts:
    post:
      operationId: createCustomShift
      tags: [schedule]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomShiftInput' } } } }
      responses:
        '200': { description: Shift created, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleExtras' } } } }
  /admin/schedule/custom-shifts/{customShiftId}/cancel:
    post:
      operationId: cancelCustomShift
      tags: [schedule]
      parameters: [{ name: customShiftId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Shift cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleExtras' } } } }
  /admin/schedule/custom-shifts/{customShiftId}/assignments:
    post:
      operationId: assignCustomShift
      tags: [schedule]
      parameters: [{ name: customShiftId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomAssignInput' } } } }
      responses:
        '200': { description: Assigned, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleExtras' } } } }
  /admin/schedule/custom-shifts/{customShiftId}/assignments/{assignmentId}:
    delete:
      operationId: removeCustomShiftAssignment
      tags: [schedule]
      parameters: [{ name: customShiftId, in: path, required: true, schema: { type: string } }, { name: assignmentId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Removed, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleExtras' } } } }
  /volunteer/custom-shifts/{customShiftId}/claim:
    post:
      operationId: claimCustomShift
      tags: [schedule]
      parameters: [{ name: customShiftId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Spot reserved, content: { application/json: { schema: { $ref: '#/components/schemas/VolunteerSchedule' } } } }
  /volunteer/custom-shifts/{customShiftId}/cancel:
    post:
      operationId: cancelOwnCustomShift
      tags: [schedule]
      parameters: [{ name: customShiftId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Reservation cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/VolunteerSchedule' } } } }
  /resources:
    get:
      operationId: getPublishedResourceList
      responses:
        "200":
          description: Published resources for volunteers; staff may preview drafts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ResourceItem" } }
  /admin/resources:
    get:
      operationId: getAdminResources
      responses:
        "200":
          description: Staff resource list, including drafts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ResourceItem" } }
    post:
      operationId: createResource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ResourceUpload" }
      responses:
        "201":
          description: Resource saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceSaveResult" }
  /admin/resources/context:
    get:
      operationId: getResourceContext
      responses:
        "200":
          description: Categories and current agreement version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceContext" }
  /admin/resources/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateResource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ResourceUpload" }
      responses:
        "200":
          description: Resource saved, retaining its identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceSaveResult" }
    delete:
      operationId: deleteResource
      responses:
        "200":
          description: Resource removed
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
  /admin/resources/{id}/publish:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: publishResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourcePublishInput" }
      responses:
        "200":
          description: Publication state saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceSaveResult" }
  /admin/resources/reorder:
    post:
      operationId: reorderResources
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceReorderInput" }
      responses:
        "200":
          description: Complete type-specific order saved
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
  /resources/{id}:
    get:
      operationId: getResource
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Published volunteer resource, or staff preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceItem" }
  /resources/{id}/file:
    get:
      operationId: downloadResourceFile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Private document stream; use a native authenticated anchor and append ?download=1 to force attachment
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
  /agreements/acknowledge:
    post:
      operationId: acknowledgeAgreement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgreementAcknowledgmentInput" }
      responses:
        "200":
          description: Current agreement acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [version, acknowledgedAt]
                properties:
                  version: { type: string }
                  acknowledgedAt: { type: string, format: date-time }
  /admin/notifications/summary:
    get:
      operationId: getNotificationSummary
      responses:
        "200":
          description: Pacific calendar month totals and provider status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSummary' }
  /admin/notifications:
    get:
      operationId: getNotificationLog
      parameters:
        - { in: query, name: type, schema: { $ref: '#/components/schemas/EmailLogType' } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/EmailLogStatus' } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Admin-only paginated email metadata; never message bodies or encrypted payloads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationLogPage' }
  /admin/notifications/settings:
    patch:
      operationId: updateNotificationLimit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationLimitInput' }
      responses:
        "200":
          description: Saved monitoring limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationLimitInput' }
  /admin/notifications/{id}/retry:
    post:
      operationId: retryNotificationEmail
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Retry result; confirmed sends are not repeated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestReminderResult' }
        "409": { description: No safe retry available }
  /admin/notifications/test:
    post:
      operationId: sendProviderTestEmail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestReminderInput' }
      responses:
        "200":
          description: Email to the authenticated administrator only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestReminderResult' }
  /admin/notifications/jobs:
    get:
      operationId: getReminderJobStatus
      responses:
        "200":
          description: Persisted reminder diagnostics and delivery totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderJobStatus' }
  /admin/notifications/jobs/run:
    post:
      operationId: runAdminReminderCheck
      parameters:
        - in: query
          name: at
          description: Development-only ISO clock override
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Reminder check result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderCheckResult' }
  /admin/notifications/jobs/test:
    post:
      operationId: sendAdminTestReminder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestReminderInput' }
      responses:
        "200":
          description: Delivery status of the test email sent only to the authenticated admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestReminderResult' }
  /jobs/run:
    post:
      operationId: runScheduledReminderCheck
      parameters:
        - in: header
          name: X-Jobs-Secret
          description: Secret machine token; JOBS_SECRET is accepted as a legacy header alias.
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        "200":
          description: Machine-authenticated check result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderCheckResult' }
        "401": { description: Missing or incorrect job secret }
        "503": { description: Trigger secret not configured }
  /admin/messages:
    get:
      operationId: listAdminMessages
      parameters:
        - { name: userId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sent messages, optionally for one volunteer
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminMessage' } }
    post:
      operationId: sendAdminMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageSendInput' }
      responses:
        '200':
          description: Saved message and email batch results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageSendResult' }
  /admin/messages/preview:
    post:
      operationId: previewAdminMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageDraftInput' }
      responses:
        '200':
          description: Exact recipient snapshot and content preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePreview' }
  /admin/messages/volunteers:
    get:
      operationId: findMessageVolunteers
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: ids, in: query, schema: { type: string } }
      responses:
        '200':
          description: Staff-only volunteer search
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MessageVolunteer' } }
  /admin/messages/{messageId}:
    get:
      operationId: getAdminMessage
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Message and per-recipient read receipts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMessageDetail' }
  /volunteer/messages/context:
    get:
      operationId: getMessageContext
      responses:
        '200':
          description: Own unread count and Alliance staff contact
          content:
            application/json:
              schema:
                type: object
                required: [unreadCount, adminContact]
                properties:
                  unreadCount: { type: integer }
                  adminContact: { type: [string, "null"] }
  /admin/schedule/controls:
    get:
      operationId: getAdminScheduleControls
      parameters:
        - { name: slotId, in: query, schema: { type: string, format: uuid } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        "200":
          description: Staff scheduling controls
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminScheduleControls' }
  /admin/schedule/assignments:
    post:
      operationId: assignAdminShift
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAssignmentInput' }
      responses:
        "200":
          description: Assignment saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolunteerShiftResult' }
  /admin/schedule/assignments/{assignmentId}/remove:
    post:
      operationId: removeAdminShift
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRemovalInput' }
      responses:
        "200":
          description: Assignment released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolunteerShiftResult' }
  /admin/schedule/assignments/{assignmentId}/skips:
    post:
      operationId: addAdminWeekOff
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VolunteerSkipInput' }
      responses:
        "200":
          description: Week off saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolunteerShiftResult' }
  /admin/schedule/assignments/{assignmentId}/skips/{skipId}:
    delete:
      operationId: removeAdminWeekOff
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: skipId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Week off removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolunteerShiftResult' }
  /admin/schedule/alerts:
    get:
      operationId: getCoverageAlertSettings
      responses:
        "200":
          description: Digest settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageAlertSettings' }
    patch:
      operationId: updateCoverageAlertSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoverageAlertInput' }
      responses:
        "200":
          description: Digest settings saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageAlertSettings' }
  /volunteer/schedule:
    get:
      operationId: getVolunteerSchedule
      responses:
        '200':
          description: Own standing shifts and anonymous slot availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolunteerSchedule' }
  /volunteer/assignments:
    post:
      operationId: bookVolunteerShift
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VolunteerBookingInput' }
      responses:
        '200':
          description: Standing shift saved and confirmation attempted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolunteerShiftResult' }
  /volunteer/assignments/{assignmentId}/change:
    post:
      operationId: changeVolunteerShift
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VolunteerBookingInput' }
      responses:
        '200':
          description: Old shift ended and replacement saved atomically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolunteerShiftResult' }
  /volunteer/assignments/{assignmentId}/drop:
    post:
      operationId: dropVolunteerShift
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Standing shift released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolunteerShiftResult' }
  /volunteer/assignments/{assignmentId}/skips:
    post:
      operationId: skipVolunteerShift
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VolunteerSkipInput' }
      responses:
        '200':
          description: Week off recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolunteerShiftResult' }
  /volunteer/assignments/{assignmentId}/skips/{skipId}:
    delete:
      operationId: undoVolunteerSkip
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string } }
        - { name: skipId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Week off undone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VolunteerShiftResult' }
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        '200':
          description: Fresh coordinator dispatch and coverage snapshot, admin only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoordinatorOverview' }
  /admin/schedule/week:
    get:
      operationId: getAdminScheduleWeek
      parameters:
