openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dev/email-test:
    post:
      operationId: testDevEmail
      tags: [health]
      summary: Check console-only email delivery in development
      description: Available only in development. Uses a fixed example.org recipient and refuses to run when live Postmark delivery is configured.
      responses:
        "200":
          description: Email printed to the server console and its logged audit row confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevEmailCheck"
        "404":
          description: Not available outside development
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevEmailCheckError"
        "409":
          description: Live delivery is configured; console-only check refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevEmailCheckError"
        "500":
          description: Email or audit verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevEmailCheckError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DevEmailCheck:
      type: object
      additionalProperties: false
      required: [ok, status, logId, relatedId]
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          enum: [logged]
        logId:
          type: string
          format: uuid
        relatedId:
          type: string
    DevEmailCheckError:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string

