openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dev/email-test:
    post:
      operationId: testDevEmail
      tags: [health]
      summary: Check console-only email delivery in development
      description: Available only in development. Uses a fixed example.org recipient and refuses to run when live Postmark delivery is configured.
      responses:
        "200":
          description: Email printed to the server console and its logged audit row confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevEmailCheck"
        "404":
          description: Not available outside development
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevEmailCheckError"
        "409":
          description: Live delivery is configured; console-only check refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevEmailCheckError"
        "500":
          description: Email or audit verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevEmailCheckError"
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Public authentication state and CSRF bootstrap
      responses:
        "200":
          description: Current authentication state; no protected profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/signup:
    post:
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/signin:
    post:
      operationId: signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninInput"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/resend-verification:
    post:
      operationId: resendVerification
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/verify:
    post:
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInput"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInput"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/reset-password:
    post:
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetInput"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/signout:
    post:
      operationId: signout
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/accept-invite:
    post:
      operationId: acceptAdminInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetInput"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /admin/users:
    get:
      operationId: listTeamUsers
      summary: Admin-only account directory
      parameters:
        - name: role
          in: query
          required: true
          schema: { type: string, enum: [admin, volunteer] }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Matching accounts, visible only to admins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamUsersResponse"
  /admin/invites:
    post:
      operationId: inviteAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInviteInput"
      responses:
        "200":
          description: Pending admin created or invitation renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInviteResult"
  /admin/users/{userId}/status:
    patch:
      operationId: setUserActiveStatus
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStatusInput"
      responses:
        "200":
          description: Updated account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
  /me:
    get:
      operationId: getMe
      description: Requires an active, verified session. Returns no password, Google subject, session version, or admin notes. Authentication failures are JSON with error and code.
      responses:
        "200":
          description: Verified account and safe volunteer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
components:
  responses:
    AuthSuccess:
      description: Authentication operation completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
  schemas:
    AdminInviteInput:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
    AdminInviteResult:
      type: object
      required: [ok, email, delivery, message]
      properties:
        ok: { type: boolean }
        email: { type: string }
        delivery: { type: string, enum: [sent, logged, failed] }
        message: { type: string }
    AccountStatusInput:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    TeamUsersResponse:
      type: object
      required: [users, total, limit, offset]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/PublicUser"
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    SignupInput:
      type: object
      required: [firstName, lastName, email, phone, password, confirmPassword]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 10, maxLength: 30 }
        password: { type: string, minLength: 8, maxLength: 72 }
        confirmPassword: { type: string, minLength: 8, maxLength: 72 }
    SigninInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1000 }
    EmailInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    TokenInput:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: "^[a-f0-9]{64}$" }
    ResetInput:
      type: object
      required: [token, password, confirmPassword]
      properties:
        token: { type: string, pattern: "^[a-f0-9]{64}$" }
        password: { type: string, minLength: 8, maxLength: 72 }
        confirmPassword: { type: string, minLength: 8, maxLength: 72 }
    AuthResult:
      type: object
      required: [ok, nextPath]
      properties:
        ok: { type: boolean }
        nextPath: { type: string }
        email: { type: string }
        message: { type: string }
    AuthSession:
      type: object
      required: [csrfToken, authenticated, verified, email, firstName, role, googleEnabled, nextPath, resendAfterSeconds]
      properties:
        csrfToken: { type: string }
        authenticated: { type: boolean }
        verified: { type: boolean }
        email: { type: [string, "null"] }
        firstName: { type: [string, "null"] }
        role: { type: [string, "null"], enum: [admin, volunteer, null] }
        googleEnabled: { type: boolean }
        nextPath: { type: string }
        resendAfterSeconds: { type: integer }
        notice: { type: string }
    Me:
      type: object
      required: [user, role, verified, profile]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        role: { type: string, enum: [admin, volunteer] }
        verified: { type: boolean }
        profile:
          anyOf:
            - $ref: "#/components/schemas/PublicVolunteerProfile"
            - type: "null"
    PublicUser:
      type: object
      required: [id, email, firstName, lastName, phone, role, emailVerifiedAt, isActive, lastLoginAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: [string, "null"] }
        role: { type: string, enum: [admin, volunteer] }
        emailVerifiedAt: { type: [string, "null"], format: date-time }
        isActive: { type: boolean }
        lastLoginAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicVolunteerProfile:
      type: object
      required: [id, userId, county, status, onboardingAnswers, onboardingCompletedAt, availabilityNotes, certificationStatus, certificationCompletedAt, certificationExpiresAt, backgroundCheckStatus, backgroundCheckSubmittedAt, backgroundCheckClearedAt, agreementAcknowledgedAt, agreementVersion, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        county: { type: string }
        status: { type: string, enum: [applicant, in_training, active, inactive] }
        onboardingAnswers: { type: object, additionalProperties: true }
        onboardingCompletedAt: { type: [string, "null"], format: date-time }
        availabilityNotes: { type: [string, "null"] }
        certificationStatus: { type: string, enum: [not_started, in_progress, complete] }
        certificationCompletedAt: { type: [string, "null"] }
        certificationExpiresAt: { type: [string, "null"] }
        backgroundCheckStatus: { type: string, enum: [not_started, pending, cleared, not_cleared] }
        backgroundCheckSubmittedAt: { type: [string, "null"] }
        backgroundCheckClearedAt: { type: [string, "null"] }
        agreementAcknowledgedAt: { type: [string, "null"], format: date-time }
        agreementVersion: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DevEmailCheck:
      type: object
      additionalProperties: false
      required: [ok, status, logId, relatedId]
      properties:
        ok:
          type: boolean
          const: true
        status:
          type: string
          enum: [logged]
        logId:
          type: string
          format: uuid
        relatedId:
          type: string
    DevEmailCheckError:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string

