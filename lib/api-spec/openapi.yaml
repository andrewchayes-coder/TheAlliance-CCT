components:
  responses:
    AuthSuccess:
      description: Authentication operation completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
  schemas:
    CustomAssignInput:
      type: object
      required: [userId, override]
      properties:
        userId: { type: string }
        override: { type: boolean }
        reason: { type: string, maxLength: 2000 }
    SlotBlockInput:
      type: object
      required: [fromDate, toDate, reason, emailVolunteers]
      properties:
        fromDate: { type: string }
        toDate: { type: string }
        slotIds: { type: array, items: { type: string } }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        emailVolunteers: { type: boolean, default: true }
    SlotBlock:
      type: object
      required: [id, shiftSlotId, date, reason]
      properties:
        id: { type: string }
        shiftSlotId: { type: string }
        date: { type: string }
        reason: { type: string }
    CustomShiftInput:
      type: object
      required: [date, startTime, endTime, capacity, openToVolunteers]
      properties:
        date: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        capacity: { type: integer, minimum: 1, maximum: 10, default: 2 }
        label: { type: [string, 'null'], maxLength: 120 }
        openToVolunteers: { type: boolean, default: false }
    VolunteerCustomShift:
      allOf:
        - { $ref: '#/components/schemas/CustomShiftInput' }
        - type: object
          required: [id, assignedCount, openSpots, ownAssignmentId, canCancel]
          properties:
            id: { type: string }
            assignedCount: { type: integer }
            openSpots: { type: integer }
            ownAssignmentId: { type: [string, 'null'] }
            canCancel: { type: boolean }
    AdminCustomShift:
      allOf:
        - { $ref: '#/components/schemas/CustomShiftInput' }
        - type: object
          required: [id, assignments]
          properties:
            id: { type: string }
            assignments:
              type: array
              items:
                type: object
                required: [id, userId, volunteerProfileId, firstName, lastName, isTestAccount]
                properties:
                  id: { type: string }
                  userId: { type: string }
                  volunteerProfileId: { type: string }
                  firstName: { type: string }
                  lastName: { type: string }
                  isTestAccount: { type: boolean }
    ScheduleExtras:
      type: object
      required: [blocks, customShifts]
      properties:
        blocks: { type: array, items: { $ref: '#/components/schemas/SlotBlock' } }
        customShifts: { type: array, items: { $ref: '#/components/schemas/AdminCustomShift' } }
    EmailLogType:
      type: string
      enum: [verification, password_reset, welcome, shift, reminder, message, admin_alert, invite]
    EmailLogStatus:
      type: string
      enum: [sent, logged, failed, suppressed]
    EmailTypeCount:
      type: object
      required: [type, count]
      properties:
        type: { $ref: '#/components/schemas/EmailLogType' }
        count: { type: integer }
    EmailMonthCount:
      type: object
      required: [month, total, byType]
      properties:
        month: { type: string }
        total: { type: integer }
        byType:
          type: array
          items: { $ref: '#/components/schemas/EmailTypeCount' }
    EmailProviderStatus:
      type: object
      required: [tokenConfigured, emailFrom, fromName, fromAddress, replyTo, deliveryEnabled]
      properties:
        tokenConfigured: { type: boolean }
        emailFrom: { type: [string, "null"] }
        fromName: { type: [string, "null"] }
        fromAddress: { type: [string, "null"] }
        replyTo: { type: [string, "null"] }
        deliveryEnabled: { type: boolean }
    NotificationSummary:
      type: object
      required: [month, total, byType, monthlyLimit, percent, months, postmark]
      properties:
        month: { type: string }
        total: { type: integer }
        byType:
          type: array
          items: { $ref: '#/components/schemas/EmailTypeCount' }
        monthlyLimit: { type: integer }
        percent: { type: number }
        months:
          type: array
          items: { $ref: '#/components/schemas/EmailMonthCount' }
        postmark: { $ref: '#/components/schemas/EmailProviderStatus' }
    NotificationLogRow:
      type: object
      required: [id, time, type, recipient, subject, status, error, canRetry]
      properties:
        id: { type: string, format: uuid }
        time: { type: string, format: date-time }
        type: { $ref: '#/components/schemas/EmailLogType' }
        recipient: { type: string }
        subject: { type: string }
        status: { $ref: '#/components/schemas/EmailLogStatus' }
        error: { type: [string, "null"] }
        canRetry: { type: boolean }
        deliveryUncertain: { type: boolean }
    NotificationLogPage:
      type: object
      required: [rows, total, page, pageSize]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/NotificationLogRow' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    NotificationLimitInput:
      type: object
