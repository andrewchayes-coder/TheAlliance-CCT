openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        '200':
          description: Fresh coordinator dispatch and coverage snapshot, admin only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoordinatorOverview' }
  /admin/schedule/week:
    get:
      operationId: getAdminScheduleWeek
      parameters:
        - name: weekStart
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
      responses:
        '200':
          description: Monday through Friday schedule with skipped assignments and closures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoordinatorWeek' }
        '400':
          description: Invalid calendar date
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /admin/schedule/settings:
    get:
      operationId: getScheduleSettings
      responses:
        '200':
          description: Administrative shift configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleSettings' }
  /admin/schedule/slots:
    post:
      operationId: createScheduleSlot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleSlotInput' }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleSettings' }
  /admin/schedule/slots/{slotId}:
    patch:
      operationId: updateScheduleSlot
      parameters:
        - { name: slotId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleSlotUpdate' }
      responses:
        '200':
          description: Updated settings and mail summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleSettings' }
  /admin/schedule/copy-monday:
    post:
      operationId: copyMondaySlots
      responses:
        '200':
          description: Missing copies added without replacing other slots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleSettings' }
  /admin/schedule/closed-dates:
    post:
      operationId: addScheduleClosedDate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleClosedDateInput' }
      responses:
        '200':
          description: Updated closures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleSettings' }
  /admin/schedule/closed-dates/{closedDateId}:
    delete:
      operationId: deleteScheduleClosedDate
      parameters:
        - { name: closedDateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Updated closures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleSettings' }
  /admin/volunteers:
    get:
      operationId: listVolunteerRoster
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: string, enum: [applicant, in_training, active, inactive] } }
        - { name: county, in: query, schema: { type: string } }
        - { name: certificationStatus, in: query, schema: { type: string, enum: [not_started, in_progress, complete] } }
        - { name: backgroundCheckStatus, in: query, schema: { type: string, enum: [not_started, pending, cleared, not_cleared] } }
        - { name: needsAttention, in: query, schema: { type: string, enum: [any, no_shift, certification_expiring, background_pending, onboarding_incomplete] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Filtered, paginated volunteer roster and unfiltered summary counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolunteerRoster" }
  /admin/volunteers/{userId}:
    get:
      operationId: getAdminVolunteer
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Read-only volunteer detail, including internal admin notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVolunteerDetail" }
  /admin/volunteers/{userId}/status:
    post:
      operationId: changeVolunteerStatus
      tags: [admin]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolunteerStatusUpdate" }
      responses:
        "200":
          description: Status saved and approval email result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolunteerStatusResult" }
        "409": { description: Volunteer or shift confirmation changed; reload before confirming }
        "422": { description: Approval requirements are missing }
  /admin/volunteers/{userId}/tracking:
    patch:
      operationId: updateVolunteerTracking
      tags: [admin]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolunteerTrackingUpdate" }
      responses:
        "200":
          description: Updated volunteer detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVolunteerDetail" }
        "409": { description: Volunteer changed; reload before saving }
  /admin/volunteers/{userId}/notes:
    patch:
      operationId: updateVolunteerNotes
      tags: [admin]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolunteerNotesUpdate" }
      responses:
        "200":
          description: Updated volunteer detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVolunteerDetail" }
        "409": { description: Notes changed; keep your draft and review the staff edit }
  /admin/volunteers/roster.csv:
    get:
      operationId: exportVolunteerRoster
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: string, enum: [applicant, in_training, active, inactive] } }
        - { name: county, in: query, schema: { type: string } }
        - { name: certificationStatus, in: query, schema: { type: string, enum: [not_started, in_progress, complete] } }
        - { name: backgroundCheckStatus, in: query, schema: { type: string, enum: [not_started, pending, cleared, not_cleared] } }
        - { name: needsAttention, in: query, schema: { type: string, enum: [any, no_shift, certification_expiring, background_pending, onboarding_incomplete] } }
      responses:
        "200":
          description: All matching volunteers, not only the visible page
          content:
            text/csv:
              schema: { type: string }
  /admin/volunteers/schedule.csv:
    get:
      operationId: exportVolunteerSchedule
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: string, enum: [applicant, in_training, active, inactive] } }
        - { name: county, in: query, schema: { type: string } }
        - { name: certificationStatus, in: query, schema: { type: string, enum: [not_started, in_progress, complete] } }
        - { name: backgroundCheckStatus, in: query, schema: { type: string, enum: [not_started, pending, cleared, not_cleared] } }
        - { name: needsAttention, in: query, schema: { type: string, enum: [any, no_shift, certification_expiring, background_pending, onboarding_incomplete] } }
      responses:
        "200":
          description: Active standing assignments belonging to matching volunteers
          content:
            text/csv:
              schema: { type: string }
  /volunteer/dashboard:
    get:
      operationId: getVolunteerDashboard
      responses:
        "200":
          description: Own shifts, active-only quick links, and latest unread message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerDashboard"
  /volunteer/profile:
    patch:
      operationId: updateVolunteerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerProfileInput"
      responses:
        "200":
          description: Updated own account/profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
  /volunteer/password:
    post:
      operationId: changeVolunteerPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Password changed and all existing sessions ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResult"
  /volunteer/messages:
    get:
      operationId: getVolunteerMessages
      responses:
        "200":
          description: Messages addressed to the signed-in volunteer only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolunteerMessage"
  /volunteer/messages/{recipientId}/read:
    patch:
      operationId: readVolunteerMessage
      parameters:
        - { name: recipientId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Own recipient record marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReadResult"
  /volunteer/resources:
    get:
      operationId: getVolunteerResources
      responses:
        "200":
          description: Published resources; active-only quick links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolunteerResource"
  /onboarding:
    patch:
      operationId: saveOnboarding
      summary: Save the signed-in volunteer's draft or complete onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Updated account and profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
  /onboarding/agreements:
    get:
      operationId: getOnboardingAgreements
      summary: Published Agreements resources needed for acknowledgment
      responses:
        "200":
          description: Published agreements and current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingAgreements"
  /onboarding/agreements/{resourceId}:
    get:
      operationId: getOnboardingAgreement
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: A published agreement resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementResource"
  /admin/volunteers/{userId}/onboarding:
    get:
      operationId: getVolunteerOnboarding
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Account and onboarding answers for administrator review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
  /admin/volunteers/onboarding.csv:
    get:
      operationId: exportVolunteerOnboarding
      responses:
        "200":
          description: CSV with question labels from the shared configuration
          content:
            text/csv:
              schema: { type: string }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dev/email-test:
    post:
      operationId: testDevEmail
      tags: [health]
      summary: Check console-only email delivery in development
      description: Available only in development. Uses a fixed example.org recipient and refuses to run when live Postmark delivery is configured.
      responses:
        "200":
          description: Email printed to the server console and its logged audit row confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevEmailCheck"
        "404":
          description: Not available outside development
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevEmailCheckError"
        "409":
          description: Live delivery is configured; console-only check refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevEmailCheckError"
        "500":
          description: Email or audit verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevEmailCheckError"
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Public authentication state and CSRF bootstrap
      responses:
        "200":
          description: Current authentication state; no protected profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/signup:
    post:
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/signin:
    post:
      operationId: signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninInput"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/resend-verification:
    post:
      operationId: resendVerification
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/verify:
    post:
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenInput"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInput"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/reset-password:
    post:
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetInput"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/signout:
    post:
      operationId: signout
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /auth/accept-invite:
    post:
      operationId: acceptAdminInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetInput"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
  /admin/users:
    get:
      operationId: listTeamUsers
      summary: Admin-only account directory
      parameters:
        - name: role
          in: query
          required: true
          schema: { type: string, enum: [admin, volunteer] }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Matching accounts, visible only to admins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamUsersResponse"
  /admin/invites:
    post:
      operationId: inviteAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInviteInput"
      responses:
        "200":
          description: Pending admin created or invitation renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInviteResult"
  /admin/users/{userId}/status:
    patch:
      operationId: setUserActiveStatus
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStatusInput"
      responses:
        "200":
          description: Updated account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
  /me:
    get:
      operationId: getMe
      description: Requires an active, verified session. Returns no password, Google subject, session version, or admin notes. Authentication failures are JSON with error and code.
      responses:
        "200":
          description: Verified account and safe volunteer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
components:
  responses:
    AuthSuccess:
      description: Authentication operation completed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResult"
  schemas:
    CoordinatorVolunteer:
      type: object
      required: [assignmentId, userId, firstName, lastName, email, phone, skipped, accountActive]
      properties:
        assignmentId: { type: string }
        userId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: [string, 'null'] }
        skipped: { type: boolean }
        accountActive: { type: boolean }
    CoordinatorBlock:
      type: object
      required: [slotId, date, dayOfWeek, startTime, endTime, startsAt, endsAt, label, capacity, assignedCount, openSpots, state, closedReason, volunteers]
      properties:
        slotId: { type: string }
        date: { type: string }
        dayOfWeek: { type: integer }
        startTime: { type: string }
        endTime: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        label: { type: [string, 'null'] }
        capacity: { type: integer }
        assignedCount: { type: integer }
        openSpots: { type: integer }
        state: { type: string, enum: [covered, under, empty, closed] }
        closedReason: { type: [string, 'null'] }
        volunteers:
          type: array
          items: { $ref: '#/components/schemas/CoordinatorVolunteer' }
    CoordinatorDay:
      type: object
      required: [date, dayOfWeek, closedReason]
      properties:
        date: { type: string }
        dayOfWeek: { type: integer }
        closedReason: { type: [string, 'null'] }
    CoordinatorWeek:
      type: object
      required: [weekStart, today, updatedAt, days, blocks, openSpots, underCoveredShifts]
      properties:
        weekStart: { type: string }
        today: { type: string }
        updatedAt: { type: string, format: date-time }
        days:
          type: array
          items: { $ref: '#/components/schemas/CoordinatorDay' }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/CoordinatorBlock' }
        openSpots: { type: integer }
        underCoveredShifts: { type: integer }
    CoordinatorActivity:
      type: object
      required: [id, userId, volunteerName, actorName, action, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        volunteerName: { type: string }
        actorName: { type: string }
        action: { type: string }
        createdAt: { type: string, format: date-time }
    CoordinatorOverview:
      type: object
      required: [updatedAt, today, weekStart, operatingNow, onShiftNow, upNext, openSpots, underCoveredShifts, needsAttention, recentActivity]
      properties:
        updatedAt: { type: string, format: date-time }
        today: { type: string }
        weekStart: { type: string }
        operatingNow: { type: boolean }
        onShiftNow:
          type: array
          items: { $ref: '#/components/schemas/CoordinatorBlock' }
        upNext:
          type: array
          items: { $ref: '#/components/schemas/CoordinatorBlock' }
        openSpots: { type: integer }
        underCoveredShifts: { type: integer }
        needsAttention: { type: integer }
        recentActivity:
          type: array
          items: { $ref: '#/components/schemas/CoordinatorActivity' }
    ScheduleSlotInput:
      type: object
      required: [dayOfWeek, startTime, endTime, capacity, label, isActive]
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 5 }
        startTime: { type: string, pattern: '^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$' }
        capacity: { type: integer, minimum: 1, maximum: 10 }
        label: { type: [string, 'null'], maxLength: 120 }
        isActive: { type: boolean }
    ScheduleSlotUpdate:
      allOf:
        - { $ref: '#/components/schemas/ScheduleSlotInput' }
        - type: object
          required: [expectedUpdatedAt, expectedAssignmentIds]
          properties:
            expectedUpdatedAt: { type: string, format: date-time }
            expectedAssignmentIds: { type: array, items: { type: string, format: uuid } }
            cancelRetirement: { type: boolean }
            deactivation:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [now, keep_until] }
                keepUntilDate: { type: string, format: date }
    ScheduleClosedDateInput:
      type: object
      required: [date, reason]
      properties:
        date: { type: string, format: date }
        reason: { type: string, minLength: 1, maxLength: 300 }
    ScheduleSlot:
      allOf:
        - { $ref: '#/components/schemas/ScheduleSlotInput' }
        - type: object
          required: [id, updatedAt, retireAfterDate, assignedCount, assignmentIds, overlaps]
          properties:
            id: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }
            retireAfterDate: { type: [string, 'null'], format: date }
            assignedCount: { type: integer }
            assignmentIds: { type: array, items: { type: string, format: uuid } }
            overlaps:
              type: array
              items: { type: object, required: [id, startTime, endTime, label], properties: { id: { type: string }, startTime: { type: string }, endTime: { type: string }, label: { type: [string, 'null'] } } }
    ScheduleSettings:
      type: object
      required: [slots, closedDates]
      properties:
        slots: { type: array, items: { $ref: '#/components/schemas/ScheduleSlot' } }
        closedDates:
          type: array
          items:
            type: object
            required: [id, date, reason]
            properties:
              id: { type: string, format: uuid }
              date: { type: string, format: date }
              reason: { type: string }
        addedSlotIds: { type: array, items: { type: string, format: uuid } }
        releasedAssignmentCount: { type: integer }
        emailSummary:
          type: object
          required: [sent, logged, failed]
          properties: { sent: { type: integer }, logged: { type: integer }, failed: { type: integer } }
    AttentionReason:
      type: string
      enum: [no_shift, certification_expiring, background_pending, onboarding_incomplete]
    AdminAssignedShift:
      type: object
      required: [assignmentId, dayOfWeek, startTime, endTime, label, startDate, endDate, upcomingSkipDates]
      properties:
        assignmentId: { type: string, format: uuid }
        dayOfWeek: { type: integer }
        startTime: { type: string }
        endTime: { type: string }
        label: { type: [string, "null"] }
        startDate: { type: string }
        endDate: { type: [string, "null"] }
        upcomingSkipDates: { type: array, items: { type: string } }
    VolunteerRosterEntry:
      type: object
      required: [user, profile, shiftCount, attention]
      properties:
        user: { $ref: "#/components/schemas/PublicUser" }
        profile: { $ref: "#/components/schemas/PublicVolunteerProfile" }
        shiftCount: { type: integer }
        attention: { type: array, items: { $ref: "#/components/schemas/AttentionReason" } }
    RosterSummary:
      type: object
      required: [applicant, in_training, active, inactive, needsAttention]
      properties:
        applicant: { type: integer }
        in_training: { type: integer }
        active: { type: integer }
        inactive: { type: integer }
        needsAttention: { type: integer }
    VolunteerRoster:
      type: object
      required: [volunteers, total, limit, offset, summary]
      properties:
